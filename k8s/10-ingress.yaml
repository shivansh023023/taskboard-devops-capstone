apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskboard-ingress
  namespace: taskboard
  labels:
    app.kubernetes.io/name: taskboard
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: taskboard-capstone
  annotations:
    # Requires an active Ingress controller (e.g., ingress-nginx or minikube addon)
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: taskboard.local
      http:
        paths:
          # Backend API endpoints (FastAPI routes are mounted with /api)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # Frontend SPA client-side routes and static assets
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
# NOTE: PostgreSQL is deliberately NOT exposed via Ingress to prevent public database access.
