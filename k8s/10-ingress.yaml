apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskboard-ingress
  namespace: taskboard
  labels:
    app.kubernetes.io/name: taskboard
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: taskboard-capstone
  annotations:
    # Requires an active Ingress controller (e.g., ingress-nginx or minikube addon)
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  rules:
    - host: taskboard.local
      http:
        paths:
          # Frontend Nginx service handles SPA client-side routes and reverse-proxies /api to backend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
# NOTE: PostgreSQL is deliberately NOT exposed via Ingress to prevent public database access.
