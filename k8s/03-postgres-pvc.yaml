apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: taskboard
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database-storage
    app.kubernetes.io/part-of: taskboard-capstone
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
