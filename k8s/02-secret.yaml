apiVersion: v1
kind: Secret
metadata:
  name: taskboard-secrets
  namespace: taskboard
  labels:
    app.kubernetes.io/name: taskboard
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: taskboard-capstone
type: Opaque
# ==============================================================================
# SECURITY TEMPLATE NOTICE — DO NOT APPLY THIS FILE DIRECTLY TO A CLUSTER
# ==============================================================================
# This file is an illustrative TEMPLATE showing the schema and keys expected by
# the TaskBoard PostgreSQL StatefulSet and FastAPI backend. It contains
# NON-WORKING placeholders and MUST NOT be applied unmodified.
#
# CRITICAL SECURITY REQUIREMENTS:
# 1. Base64 encoding in Kubernetes Secrets is NOT encryption. It is merely a
#    serialization format for binary data. Anyone with read access to the
#    cluster or Git history can decode values using standard decoding tools.
# 2. Never commit real or working database passwords to version control.
#
# RECOMMENDED SAFE LOCAL WORKFLOW (PowerShell):
# Rather than editing and applying this manifest file, generate the Secret
# directly in your local cluster using kubectl CLI:
#
#   # Step 1: Generate a cryptographically secure, URL-safe alphanumeric password (24 characters):
#   $chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'
#   $bytes = New-Object byte[] 24
#   [System.Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
#   $dbPassword = (-join ($bytes | ForEach-Object { $chars[$_ % $chars.Length] }))
#
#   # Step 2: Create the Secret in the 'taskboard' namespace (no file committed):
#   kubectl create secret generic taskboard-secrets -n taskboard `
#     --from-literal=POSTGRES_PASSWORD="$dbPassword" `
#     --from-literal=DATABASE_URL="postgresql+psycopg://taskboard:$($dbPassword)@postgres:5432/taskboard"
#
#   # Step 3: Verify the Secret exists without exposing its values:
#   kubectl get secret taskboard-secrets -n taskboard
# ==============================================================================
stringData:
  # NON-WORKING PLACEHOLDER VALUES
  # The keys 'POSTGRES_PASSWORD' and 'DATABASE_URL' are required by workloads.
  POSTGRES_PASSWORD: "REPLACE_WITH_SECURE_PASSWORD_DO_NOT_APPLY_UNMODIFIED"
  DATABASE_URL: "postgresql+psycopg://taskboard:REPLACE_WITH_SECURE_PASSWORD_DO_NOT_APPLY_UNMODIFIED@postgres:5432/taskboard"
