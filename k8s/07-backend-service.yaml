apiVersion: v1
kind: Service
metadata:
  # The service name MUST be 'backend' so Nginx proxy_pass http://backend:8000 resolves correctly
  name: backend
  namespace: taskboard
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api-service
    app.kubernetes.io/part-of: taskboard-capstone
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
