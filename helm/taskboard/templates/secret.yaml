{{- if not .Values.postgresql.auth.existingSecret }}
{{- if not .Values.postgresql.auth.password }}
{{- fail "ERROR: Database credentials are required! Please provide a password via '--set postgresql.auth.password=<password>' or reference a pre-created Secret via '--set postgresql.auth.existingSecret=<secret-name>'." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskboard.fullname" . }}-secrets
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "taskboard.name" . }}
    app.kubernetes.io/component: secrets
type: Opaque
data:
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | b64enc | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s:%v/%s" .Values.postgresql.auth.username (.Values.postgresql.auth.password | urlquery) .Values.postgresql.service.name .Values.postgresql.service.port .Values.postgresql.auth.database | b64enc | quote }}
{{- end }}
