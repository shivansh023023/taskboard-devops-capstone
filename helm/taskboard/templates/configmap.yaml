apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taskboard.fullname" . }}-config
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "taskboard.name" . }}
    app.kubernetes.io/component: config
data:
  ENVIRONMENT: {{ .Values.global.environment | quote }}
  DEBUG: {{ .Values.config.debug | quote }}
  PROJECT_NAME: {{ .Values.config.projectName | quote }}
  API_V1_STR: {{ .Values.config.apiV1Str | quote }}
  BACKEND_CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  POSTGRES_DB: {{ .Values.postgresql.auth.database | quote }}
  POSTGRES_USER: {{ .Values.postgresql.auth.username | quote }}
  POSTGRES_HOST: {{ .Values.postgresql.service.name | quote }}
  POSTGRES_PORT: {{ .Values.postgresql.service.port | quote }}
