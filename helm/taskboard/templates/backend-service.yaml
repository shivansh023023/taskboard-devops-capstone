apiVersion: v1
kind: Service
metadata:
  # Crucial: Nginx in frontend container routes to http://backend:8000
  name: {{ .Values.backend.service.name }}
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "taskboard.name" . }}-backend
    app.kubernetes.io/component: api-service
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.port }}
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "taskboard.name" . }}-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
