name: TaskBoard CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Enforce minimal global permissions (principle of least privilege)
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # =========================================================================
  # Job A: Backend Automated Tests (Pytest + PostgreSQL Service)
  # =========================================================================
  backend-tests:
    name: Backend Tests (Pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskboard_ci
          POSTGRES_PASSWORD: taskboard_ci_password
          POSTGRES_DB: taskboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.13
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic database migrations
        env:
          DATABASE_URL: postgresql+psycopg://taskboard_ci:taskboard_ci_password@localhost:5432/taskboard_test
        run: |
          alembic -c backend/alembic.ini upgrade head

      - name: Execute Pytest test suite
        env:
          DATABASE_URL: postgresql+psycopg://taskboard_ci:taskboard_ci_password@localhost:5432/taskboard_test
          ENVIRONMENT: test
          DEBUG: "True"
        run: |
          pytest -v backend/tests

  # =========================================================================
  # Job B: Frontend Production Build (Node.js + Vite)
  # =========================================================================
  frontend-build:
    name: Frontend Build (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (clean reproducible install)
        working-directory: frontend
        run: npm ci

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

  # =========================================================================
  # Job C: Docker Build & Trivy Vulnerability Security Scan
  # =========================================================================
  docker-build-and-scan:
    name: Docker Build & Trivy Scan
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-build
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build backend image locally for scanning
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: taskboard-backend:ci-scan-${{ github.sha }}

      - name: Build frontend image locally for scanning
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: taskboard-frontend:ci-scan-${{ github.sha }}

      - name: Run Trivy vulnerability scan on backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: taskboard-backend:ci-scan-${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Run Trivy vulnerability scan on frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: taskboard-frontend:ci-scan-${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

  # =========================================================================
  # Job D: Publish Container Images to GitHub Container Registry (GHCR)
  # =========================================================================
  publish-ghcr:
    name: Publish Images to GHCR
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-build
      - docker-build-and-scan
    # Publish ONLY on pushes to the default branch (never on pull requests or forks)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Normalize repository names for GHCR
        id: prep
        run: |
          # Lowercase owner and repository name for valid OCI registry format
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME_LOWER=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          
          BACKEND_IMAGE="ghcr.io/${OWNER_LOWER}/${REPO_NAME_LOWER}-backend"
          FRONTEND_IMAGE="ghcr.io/${OWNER_LOWER}/${REPO_NAME_LOWER}-frontend"
          
          echo "backend_image=${BACKEND_IMAGE}" >> $GITHUB_OUTPUT
          echo "frontend_image=${FRONTEND_IMAGE}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@9780b0c442f84e1734f71a496b89be773377630c # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build and push Backend image to GHCR
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.prep.outputs.backend_image }}:${{ github.sha }}
            ${{ steps.prep.outputs.backend_image }}:latest
            ${{ steps.prep.outputs.backend_image }}:main

      - name: Build and push Frontend image to GHCR
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.prep.outputs.frontend_image }}:${{ github.sha }}
            ${{ steps.prep.outputs.frontend_image }}:latest
            ${{ steps.prep.outputs.frontend_image }}:main

  # =========================================================================
  # Job E: Pipeline Summary Report
  # =========================================================================
  pipeline-summary:
    name: Pipeline Summary Report
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-build
      - docker-build-and-scan
      - publish-ghcr
    if: always()

    steps:
      - name: Generate GitHub Actions Step Summary
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME_LOWER=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          BACKEND_IMAGE="ghcr.io/${OWNER_LOWER}/${REPO_NAME_LOWER}-backend"
          FRONTEND_IMAGE="ghcr.io/${OWNER_LOWER}/${REPO_NAME_LOWER}-frontend"

          STATUS_TESTS="${{ needs.backend-tests.result }}"
          STATUS_FRONTEND="${{ needs.frontend-build.result }}"
          STATUS_SECURITY="${{ needs.docker-build-and-scan.result }}"
          STATUS_PUBLISH="${{ needs.publish-ghcr.result }}"

          format_status() {
            case "$1" in
              success) echo "✅ Passed" ;;
              failure) echo "❌ Failed" ;;
              cancelled) echo "🚫 Cancelled" ;;
              skipped) echo "⏭️ Skipped" ;;
              *) echo "❓ $1" ;;
            esac
          }

          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # 🚀 TaskBoard CI/CD Pipeline Summary

          | Pipeline Stage | Status | Description |
          | :--- | :--- | :--- |
          | **Backend Tests (Pytest)** | $(format_status "$STATUS_TESTS") | 16 tests with PostgreSQL service container & Alembic |
          | **Frontend Build (Vite)** | $(format_status "$STATUS_FRONTEND") | Clean `npm ci` install & static asset bundle build |
          | **Docker Build & Security** | $(format_status "$STATUS_SECURITY") | Trivy container vulnerability scan (HIGH/CRITICAL blocking) |
          | **GHCR Image Publication** | $(format_status "$STATUS_PUBLISH") | Push to GitHub Container Registry (main branch only) |

          EOF

          if [ "$STATUS_PUBLISH" = "success" ]; then
            cat << EOF >> $GITHUB_STEP_SUMMARY
          ### 📦 Published Images (GHCR)
          - **Backend**: \`${BACKEND_IMAGE}:${{ github.sha }}\`
            - Also tagged: \`${BACKEND_IMAGE}:latest\`, \`${BACKEND_IMAGE}:main\`
          - **Frontend**: \`${FRONTEND_IMAGE}:${{ github.sha }}\`
            - Also tagged: \`${FRONTEND_IMAGE}:latest\`, \`${FRONTEND_IMAGE}:main\`
          EOF
          else
            cat << EOF >> $GITHUB_STEP_SUMMARY
          > ℹ️ **Image Publishing**: Images are published to GHCR exclusively on pushes to the \`main\` branch when all validation checks pass.
          EOF
          fi

      - name: Check overall pipeline status
        run: |
          if [ "${{ needs.backend-tests.result }}" != "success" ] || \
             [ "${{ needs.frontend-build.result }}" != "success" ] || \
             [ "${{ needs.docker-build-and-scan.result }}" != "success" ]; then
            echo "::error::One or more mandatory validation jobs failed."
            exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ needs.publish-ghcr.result }}" != "success" ]; then
            echo "::error::Publishing to GHCR failed on the main branch."
            exit 1
          fi
          echo "All pipeline jobs completed successfully!"
